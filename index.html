<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MASSACRE — Access Keys</title>
<meta name="theme-color" content="#06050a" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06050a;
  --panel:rgba(20,10,16,.66);
  --panel-solid:#120a11;
  --line:rgba(255,45,69,.18);
  --line-strong:rgba(255,45,69,.45);
  --red:#e01029;
  --red2:#ff2d45;
  --text:#ece8ee;
  --muted:#918a9c;
  --ok:#3ddc84;
  --radius:16px;
}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body.locked{overflow:hidden}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font-family:inherit}
.hidden{display:none !important}

/* ============================================================
   BACKGROUND CANVAS + VIGNETTE
   ============================================================ */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 60% at 50% 35%, transparent 0%, rgba(4,2,6,.55) 62%, rgba(3,1,5,.92) 100%),
    radial-gradient(circle at 50% 0%, rgba(224,16,41,.10), transparent 55%);
}
.scanlines{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(to bottom, rgba(255,255,255,.025) 0 1px, transparent 1px 3px);
  mix-blend-mode:overlay;
}

/* ============================================================
   INTRO ANIMATION
   ============================================================ */
#intro{
  position:fixed;inset:0;z-index:9999;
  background:#000;
  overflow:hidden;
  animation:introOut .9s ease 3.8s forwards;
}
@keyframes introOut{ to{ opacity:0; visibility:hidden; } }

.shake{
  position:absolute;inset:0;
  animation:shakeIt .62s cubic-bezier(.36,.07,.19,.97) .95s;
}
@keyframes shakeIt{
  0%,100%{transform:translate(0,0) rotate(0)}
  6%{transform:translate(-18px,8px) rotate(-.7deg)}
  14%{transform:translate(15px,-12px) rotate(.8deg)}
  24%{transform:translate(-13px,-7px) rotate(-.5deg)}
  36%{transform:translate(11px,10px) rotate(.4deg)}
  50%{transform:translate(-7px,4px) rotate(-.25deg)}
  66%{transform:translate(5px,-4px) rotate(.15deg)}
  82%{transform:translate(-2px,1px) rotate(0)}
}

/* ---- the gash ---- */
.gash{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.gash-line,.gash-glow{
  fill:none;
  stroke-dasharray:100;
  stroke-dashoffset:100;
  animation:gashDraw .30s cubic-bezier(.2,.85,.3,1) .95s forwards;
}
.gash-line{
  stroke:#ff0a25;stroke-width:3;stroke-linecap:round;
  filter:drop-shadow(0 0 7px rgba(255,0,45,.95)) drop-shadow(0 0 22px rgba(200,0,35,.7));
}
.gash-glow{
  stroke:rgba(170,0,25,.9);stroke-width:20;stroke-linecap:round;
  filter:blur(8px);
}
@keyframes gashDraw{ to{ stroke-dashoffset:0; } }

/* ---- cracks radiating from the cut ---- */
.cracks{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.crack{
  fill:none;
  stroke:rgba(255,92,112,.85);
  stroke-width:1;
  stroke-linecap:round;
  vector-effect:non-scaling-stroke;
  stroke-dasharray:220;
  stroke-dashoffset:220;
  opacity:0;
  filter:drop-shadow(0 0 3px rgba(255,30,60,.9));
  animation:crackDraw .45s ease-out forwards;
}
@keyframes crackDraw{
  0%{opacity:1;stroke-dashoffset:220}
  70%{opacity:.95;stroke-dashoffset:0}
  100%{opacity:.6;stroke-dashoffset:0}
}

/* ---- blood drips ---- */
.drips,.splatter,.sparks{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.drip{
  position:absolute;
  width:var(--w,5px);
  height:0;
  transform:translateX(-50%);
  border-radius:0 0 50% 50%/0 0 100% 100%;
  background:linear-gradient(to bottom,#3d0007 0%,#8d0014 30%,#c8001c 65%,#ff1e35 100%);
  box-shadow:0 0 9px rgba(255,20,50,.8), 0 0 22px rgba(180,0,30,.45);
  opacity:0;
  animation:dripGrow var(--dur,2.2s) cubic-bezier(.4,0,.6,1) forwards;
  animation-delay:var(--delay,1.3s);
}
.drip::after{
  content:"";position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);
  width:calc(var(--w) * 2.3);height:calc(var(--w) * 2.3);
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff5566,#a5001a 72%);
  box-shadow:0 0 11px rgba(255,30,55,.85);
}
@keyframes dripGrow{
  0%{height:0;opacity:0}
  10%{opacity:1}
  100%{height:var(--h,120px);opacity:1}
}

/* ---- splatter dots ---- */
.splat{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff4657,#8f0014 75%);
  box-shadow:0 0 6px rgba(255,25,50,.55);
  opacity:0;
  animation:splatIn .42s ease-out forwards;
}
@keyframes splatIn{
  0%{opacity:0;transform:scale(.15)}
  60%{opacity:1;transform:scale(1.18)}
  100%{opacity:.85;transform:scale(1)}
}

/* ---- sparks ---- */
.spark{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle,#fff 0%,#ff9aa6 35%,#ff2d45 70%,transparent 100%);
  box-shadow:0 0 9px rgba(255,45,69,.9);
  opacity:0;
  animation:sparkFly var(--d,.6s) cubic-bezier(.15,.7,.3,1) .95s forwards;
}
@keyframes sparkFly{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.15)}
  12%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(.08)}
}

/* ---- slash arc trail ---- */
.slash-arc{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.arc-glow,.arc-core{
  fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke;
  stroke-dasharray:100;stroke-dashoffset:100;
}
.arc-glow{
  stroke:rgba(255,30,60,.55);
  stroke-width:26;
  filter:blur(12px);
  animation:arcSweep .5s cubic-bezier(.4,0,.3,1) .42s forwards;
}
.arc-core{
  stroke:#fff;
  stroke-width:2.4;
  filter:drop-shadow(0 0 8px #ff2d45) drop-shadow(0 0 20px rgba(255,20,50,.7));
  animation:arcSweep .5s cubic-bezier(.4,0,.3,1) .42s forwards;
}
@keyframes arcSweep{
  0%{stroke-dashoffset:100;opacity:1}
  80%{stroke-dashoffset:0;opacity:1}
  100%{stroke-dashoffset:0;opacity:0}
}

/* ---- impact flash ---- */
.flash{
  position:absolute;inset:0;opacity:0;pointer-events:none;
  background:radial-gradient(circle at 50% 47%, #ffffff 0%, #ffd9de 12%, #ff2d45 42%, rgba(255,0,40,0) 70%);
  animation:flashPop .6s ease-out .95s forwards;
}
@keyframes flashPop{
  0%{opacity:0} 8%{opacity:1} 30%{opacity:.45} 100%{opacity:0}
}

/* ---- shockwave ring ---- */
.shockwave{
  position:absolute;top:50%;left:50%;
  width:44px;height:44px;margin:-22px 0 0 -22px;
  border-radius:50%;
  border:2px solid rgba(255,45,69,.9);
  box-shadow:0 0 34px rgba(255,45,69,.85), inset 0 0 26px rgba(255,45,69,.5);
  opacity:0;
  pointer-events:none;
  animation:shock 1s cubic-bezier(.15,.8,.3,1) .95s forwards;
}
@keyframes shock{
  0%{opacity:.95;transform:scale(.15)}
  100%{opacity:0;transform:scale(26)}
}

/* ---- the knife ---- */
.knife-wrap{
  position:absolute;top:50%;left:50%;
  width:172px;height:600px;
  margin:-300px 0 0 -86px;
  opacity:0;
  filter:drop-shadow(0 0 30px rgba(255,25,55,.55)) drop-shadow(0 20px 55px rgba(0,0,0,.95));
  will-change:transform,opacity;
  animation:knifeSlash 1.55s cubic-bezier(.5,0,.25,1) .1s forwards;
}
.knife{width:100%;height:100%;display:block;transform-origin:50% 50%;
  animation:knifeBlur 1.55s cubic-bezier(.5,0,.25,1) .1s forwards;}
@keyframes knifeBlur{
  0%{filter:blur(0)}
  22%{filter:blur(1.6px)}
  48%{filter:blur(4px)}
  58%{filter:blur(2px)}
  72%{filter:blur(0)}
  100%{filter:blur(0)}
}
@keyframes knifeSlash{
  0%   { transform:translate(80vw,-36vh) rotate(-50deg) scale(.62); opacity:0; }
  8%   { opacity:1; }
  55%  { transform:translate(0,0) rotate(-100deg) scale(1.18); opacity:1; }
  66%  { transform:translate(-6vw,4vh) rotate(-107deg) scale(1.18); opacity:1; }
  84%  { transform:translate(-44vw,22vh) rotate(-131deg) scale(.94); opacity:.5; }
  100% { transform:translate(-96vw,48vh) rotate(-162deg) scale(.58); opacity:0; }
}

/* ---- skip ---- */
.skip{
  position:absolute;left:50%;bottom:34px;transform:translateX(-50%);
  font-size:11px;letter-spacing:.32em;text-transform:uppercase;
  color:rgba(255,255,255,.28);
  animation:skipPulse 1.8s ease-in-out infinite;
  z-index:5;
}
@keyframes skipPulse{ 0%,100%{opacity:.28} 50%{opacity:.7} }

/* ============================================================
   LAYOUT
   ============================================================ */
.page{position:relative;z-index:2;display:flex;flex-direction:column;min-height:100vh}

header{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;
  padding:18px clamp(16px,4vw,48px);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  background:linear-gradient(to bottom, rgba(6,5,10,.92), rgba(6,5,10,.55));
  border-bottom:1px solid rgba(255,45,69,.10);
}
.brand{
  font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;
  font-size:clamp(22px,3.4vw,30px);
  letter-spacing:.22em;
  color:#fff;
  text-shadow:0 0 18px rgba(255,45,69,.55), 0 0 46px rgba(224,16,41,.35);
  user-select:none;
}
.brand span{color:var(--red2)}
.nav{display:flex;align-items:center;gap:10px}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 22px;
  border-radius:10px;
  font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  transition:transform .16s ease, box-shadow .16s ease, background .16s ease, border-color .16s ease;
  border:1px solid transparent;
  white-space:nowrap;
}
.btn:active{transform:scale(.975)}
.btn.primary{
  background:linear-gradient(180deg,#ff2d45,#b4001b);
  color:#fff;
  border-color:rgba(255,120,140,.45);
  box-shadow:0 8px 26px -8px rgba(255,20,50,.85), inset 0 1px 0 rgba(255,255,255,.28);
}
.btn.primary:hover{box-shadow:0 12px 34px -8px rgba(255,20,50,1), inset 0 1px 0 rgba(255,255,255,.35)}
.btn.ghost{
  background:rgba(255,255,255,.035);
  border-color:var(--line-strong);
  color:#fff;
}
.btn.ghost:hover{background:rgba(255,45,69,.12);border-color:var(--red2)}
.btn.small{padding:9px 16px;font-size:11px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:saturate(.4)}
.btn.wide{width:100%}

.icon-btn{
  width:36px;height:36px;border-radius:9px;
  display:grid;place-items:center;
  border:1px solid var(--line);
  background:rgba(255,255,255,.03);
  font-size:15px;color:var(--muted);
  transition:.16s;
}
.icon-btn:hover{color:#fff;border-color:var(--red2);background:rgba(255,45,69,.14)}

/* ============================================================
   USER CHIP
   ============================================================ */
.user-chip{
  display:flex;align-items:center;gap:10px;
  padding:5px 6px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(255,255,255,.03);
}
.user-chip img{
  width:30px;height:30px;border-radius:50%;
  border:1px solid rgba(255,45,69,.5);
  object-fit:cover;
  background:#1a1016;
}
.user-chip .uname{
  font-size:13px;font-weight:600;max-width:150px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.owner-tag{
  font-size:9px;font-weight:800;letter-spacing:.14em;
  padding:3px 7px;border-radius:5px;
  background:linear-gradient(180deg,#ff2d45,#9c0017);
  color:#fff;
  box-shadow:0 0 16px rgba(255,20,50,.6);
}

/* ============================================================
   HERO
   ============================================================ */
main{flex:1;padding:clamp(24px,5vw,56px) clamp(16px,4vw,48px) 60px;max-width:1180px;margin:0 auto;width:100%}

.hero{text-align:center;padding:clamp(20px,5vw,48px) 0 clamp(28px,5vw,52px)}
.hero h1{
  font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;
  font-size:clamp(52px,13vw,132px);
  line-height:.9;
  letter-spacing:.06em;
  color:#fff;
  text-shadow:
    0 0 22px rgba(255,45,69,.65),
    0 0 70px rgba(224,16,41,.45),
    0 0 140px rgba(224,16,41,.25);
  user-select:none;
}
.hero .tag{
  margin-top:14px;
  font-size:clamp(12px,1.6vw,15px);
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--muted);
}
.hero .rule{
  width:min(420px,70%);
  height:1px;margin:26px auto 0;
  background:linear-gradient(to right, transparent, var(--red2), transparent);
  opacity:.6;
}

/* ============================================================
   CARDS
   ============================================================ */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(310px,1fr));
  gap:clamp(16px,2.4vw,26px);
}
.card{
  position:relative;
  padding:clamp(22px,3vw,32px);
  border-radius:var(--radius);
  border:1px solid var(--line);
  background:
    linear-gradient(160deg, rgba(255,45,69,.06), rgba(0,0,0,0) 45%),
    var(--panel);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:0 24px 60px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.05);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.card::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(600px 200px at 50% -10%, rgba(255,45,69,.16), transparent 70%);
}
.card h2{
  font-family:'Bebas Neue',Impact,sans-serif;
  font-size:clamp(24px,3vw,32px);
  letter-spacing:.12em;
  margin:10px 0 0;
  color:#fff;
}
.badge{
  display:inline-block;
  font-size:9px;font-weight:800;letter-spacing:.2em;
  padding:5px 10px;border-radius:6px;
  color:var(--red2);
  border:1px solid var(--line-strong);
  background:rgba(255,45,69,.09);
}
.price{
  margin:16px 0 6px;
  font-family:'Bebas Neue',Impact,sans-serif;
  font-size:clamp(44px,7vw,62px);
  line-height:1;color:#fff;
  display:flex;align-items:baseline;gap:2px;
}
.price small{font-size:.42em;color:var(--muted);letter-spacing:.06em}
.feats{list-style:none;margin:18px 0 26px;display:grid;gap:10px}
.feats li{
  display:flex;align-items:center;gap:10px;
  font-size:13.5px;color:#cfc8d6;
}
.feats li::before{
  content:"✕";
  color:var(--red2);font-size:11px;font-weight:800;
  width:18px;height:18px;flex:0 0 18px;
  display:grid;place-items:center;border-radius:50%;
  border:1px solid rgba(255,45,69,.35);
  background:rgba(255,45,69,.08);
}
.card .spacer{flex:1}

/* key display */
.keybox{
  margin-top:18px;
  padding:16px;
  border-radius:12px;
  border:1px dashed rgba(255,45,69,.4);
  background:rgba(255,45,69,.06);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  flex-wrap:wrap;
}
.keybox code{
  font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  font-size:clamp(12px,2.4vw,15px);
  letter-spacing:.05em;
  color:#fff;
  word-break:break-all;
}
.muted{color:var(--muted);font-size:13.5px;line-height:1.65}
.status{
  display:inline-flex;align-items:center;gap:7px;
  font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ok);
}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);display:block}
.status.off{color:var(--red2)}
.status.off i{background:var(--red2);box-shadow:0 0 10px var(--red2)}

/* ============================================================
   MODAL
   ============================================================ */
.modal-backdrop{
  position:fixed;inset:0;z-index:900;
  display:grid;place-items:center;
  padding:20px;
  background:rgba(3,2,6,.78);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  width:min(620px,100%);
  max-height:86vh;
  display:flex;flex-direction:column;
  border-radius:18px;
  border:1px solid var(--line-strong);
  background:linear-gradient(160deg, rgba(255,45,69,.07), rgba(0,0,0,0) 40%), var(--panel-solid);
  box-shadow:0 40px 120px -30px #000, 0 0 90px -20px rgba(255,20,50,.35);
  animation:modalIn .24s cubic-bezier(.2,.9,.3,1);
  overflow:hidden;
}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:18px 22px;
  border-bottom:1px solid rgba(255,45,69,.14);
}
.modal-head h3{
  font-family:'Bebas Neue',Impact,sans-serif;
  font-size:22px;letter-spacing:.14em;color:#fff;
}
.modal-body{padding:22px;overflow-y:auto}

/* key manager */
.km-controls{
  display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;
  padding-bottom:18px;margin-bottom:18px;
  border-bottom:1px solid rgba(255,45,69,.12);
}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.field input{
  width:110px;padding:10px 12px;border-radius:9px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
  color:#fff;font-size:14px;outline:none;
}
.field input:focus{border-color:var(--red2);box-shadow:0 0 0 3px rgba(255,45,69,.14)}
.km-list{display:grid;gap:8px;max-height:340px;overflow-y:auto;padding-right:4px}
.km-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 13px;border-radius:10px;
  border:1px solid rgba(255,45,69,.14);
  background:rgba(255,255,255,.025);
  font-size:12.5px;
}
.km-row code{
  font-family:ui-monospace,Menlo,Consolas,monospace;
  color:#fff;font-size:12px;letter-spacing:.03em;
  word-break:break-all;
}
.km-row .tagx{
  font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap;
}
.km-row .tagx.used{color:var(--red2)}
.empty{
  text-align:center;padding:28px 10px;color:var(--muted);font-size:13px;
}

/* ============================================================
   TOAST
   ============================================================ */
#toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
  z-index:1000;
  padding:13px 22px;border-radius:11px;
  border:1px solid var(--line-strong);
  background:rgba(20,10,16,.96);
  box-shadow:0 20px 50px -14px #000, 0 0 40px -10px rgba(255,20,50,.5);
  font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;
  transition:opacity .22s, transform .22s;
  max-width:calc(100vw - 40px);
  text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ============================================================
   FOOTER
   ============================================================ */
footer{
  padding:26px clamp(16px,4vw,48px) 34px;
  text-align:center;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(145,138,156,.55);
  border-top:1px solid rgba(255,45,69,.08);
}
footer a{color:rgba(255,45,69,.75);text-decoration:none}
footer a:hover{color:var(--red2)}

/* scrollbars */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,45,69,.3);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,45,69,.55);background-clip:content-box}

@media (max-width:560px){
  .user-chip .uname{max-width:84px}

<script>
/* ================================================================
   MASSACRE — app
   ⚠️  OAuth secrets and ownership checks MUST live on a server.
       This file is a front-end demo only.
   ================================================================ */
'use strict';

/* ---------------- CONFIG ---------------- */
const CLIENT_ID       = '1564751707504644146';
const REDIRECT_URI    = location.origin + location.pathname;
const OWNER_USERNAMES = ['iamtira.misu'];
const OWNER_IDS       = [];
const LS_SESSION = 'massacre.session.v1';
const LS_KEYS    = 'massacre.keys.v1';
const LS_MYKEY   = 'massacre.mykey.v1';

/* ---------------- STATE ---------------- */
let user = null;
let demoMode = false;

/* ---------------- HELPERS ---------------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function toast(msg, ms = 2600) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), ms);
}

function randBytes(n) {
  const a = new Uint8Array(n);
  (crypto.getRandomValues ? crypto : { getRandomValues: x => x.forEach((_, i) => x[i] = Math.random() * 256 | 0) })
    .getRandomValues(a);
  return a;
}

/* ================================================================
   1. CONSTELLATION BACKGROUND
   ================================================================ */
(function constellations() {
  const cv  = $('#bg');
  const ctx = cv.getContext('2d', { alpha: true });
  let W = 0, H = 0, dpr = 1, stars = [], LINK = 150;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.width  = Math.floor(innerWidth  * dpr);
    H = cv.height = Math.floor(innerHeight * dpr);
    cv.style.width  = innerWidth  + 'px';
    cv.style.height = innerHeight + 'px';
    LINK = Math.min(innerWidth, innerHeight) * 0.24 * dpr;
    build();
  }

  function build() {
    const n = Math.max(55, Math.min(150, Math.round((innerWidth * innerHeight) / 13000)));
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: (Math.random() * 1.25 + 0.35) * dpr,
      vx: (Math.random() - 0.5) * 0.06 * dpr,
      vy: (Math.random() - 0.5) * 0.06 * dpr,
      ph: Math.random() * Math.PI * 2,
      sp: 0.35 + Math.random() * 1.15,
      big: Math.random() < 0.14
    }));
  }

  function frame(ts) {
    const t = ts / 1000;
    ctx.clearRect(0, 0, W, H);

    for (const s of stars) {
      s.x += s.vx; s.y += s.vy;
      if (s.x < -20) s.x = W + 20; else if (s.x > W + 20) s.x = -20;
      if (s.y < -20) s.y = H + 20; else if (s.y > H + 20) s.y = -20;
    }

    const L2 = LINK * LINK;
    ctx.lineWidth = 0.7 * dpr;
    for (let i = 0; i < stars.length; i++) {
      const a = stars[i];
      for (let j = i + 1; j < stars.length; j++) {
        const b = stars[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d2 = dx * dx + dy * dy;
        if (d2 > L2) continue;
        const alpha = (1 - Math.sqrt(d2) / LINK) * 0.24;
        ctx.strokeStyle = 'rgba(215,25,55,' + alpha.toFixed(3) + ')';
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
    }

    for (const s of stars) {
      const tw = 0.5 + 0.5 * Math.sin(t * s.sp + s.ph);
      const al = 0.28 + 0.72 * tw;

      if (s.big) {
        const R = s.r * 9;
        const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, R);
        g.addColorStop(0,   'rgba(255,80,100,' + (0.45 * al).toFixed(3) + ')');
        g.addColorStop(0.4, 'rgba(255,40,70,'  + (0.16 * al).toFixed(3) + ')');
        g.addColorStop(1,   'rgba(255,20,60,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(s.x, s.y, R, 0, Math.PI * 2); ctx.fill();
      }

      ctx.fillStyle = 'rgba(255,196,206,' + al.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * (s.big ? 1.5 : 1), 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }

  addEventListener('resize', resize, { passive: true });
  resize();
  requestAnimationFrame(frame);
})();

/* ================================================================
   2. INTRO ANIMATION  (knife slash · gash · blood · sparks)
   ================================================================ */
(function intro() {
  const introEl   = $('#intro');
  const dripsEl   = $('.drips');
  const splatEl   = $('.splatter');
  const sparksEl  = $('.sparks');
  const cracksEl  = $('.cracks');
  const SVGNS     = 'http://www.w3.org/2000/svg';

  /* ---- blood drips along the gash ---- */
  function buildDrips() {
    dripsEl.innerHTML = '';
    const count = window.innerWidth < 600 ? 11 : 18;
    for (let i = 0; i < count; i++) {
      const u = 0.03 + Math.random() * 0.94;      // 0..1 along the cut
      const x = 108 - u * 116;                    // follows M 108 24 Q 50 46 -8 68
      const y = 24 + u * 44 + Math.sin(u * Math.PI) * 4;
      const d = document.createElement('div');
      d.className = 'drip';
      d.style.left = x + '%';
      d.style.top  = y + '%';
      d.style.setProperty('--w',     (2.6 + Math.random() * 5).toFixed(1) + 'px');
      d.style.setProperty('--h',     (60 + Math.random() * 280).toFixed(0) + 'px');
      d.style.setProperty('--dur',   (1.6 + Math.random() * 2.0).toFixed(2) + 's');
      d.style.setProperty('--delay', (1.25 + Math.random() * 1.1).toFixed(2) + 's');
      dripsEl.appendChild(d);
    }
  }

  /* ---- splatter dots ---- */
  function buildSplatter() {
    splatEl.innerHTML = '';
    const n = window.innerWidth < 600 ? 26 : 46;
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div');
      d.className = 'splat';
      const u = Math.random();
      d.style.left = (108 - u * 116 + (Math.random() - 0.5) * 14) + '%';
      d.style.top  = (24 + u * 44 + (Math.random() - 0.5) * 18) + '%';
      const sz = (1 + Math.random() * 4).toFixed(1);
      d.style.width = d.style.height = sz + 'px';
      d.style.animationDelay = (0.98 + Math.random() * 0.55).toFixed(2) + 's';
      splatEl.appendChild(d);
    }
  }

  /* ---- sparks flying from the impact ---- */
  function buildSparks() {
    sparksEl.innerHTML = '';
    const n = 34;
    for (let i = 0; i < n; i++) {
      const s = document.createElement('div');
      s.className = 'spark';
      const ang  = Math.random() * Math.PI * 2;
      const dist = 90 + Math.random() * 320;
      s.style.setProperty('--tx', (Math.cos(ang) * dist).toFixed(0) + 'px');
      s.style.setProperty('--ty', (Math.sin(ang) * dist).toFixed(0) + 'px');
      s.style.setProperty('--d',  (0.45 + Math.random() * 0.8).toFixed(2) + 's');
      s.style.left = (47 + Math.random() * 8) + '%';
      s.style.top  = (44 + Math.random() * 8) + '%';
      const sz = (1.5 + Math.random() * 2.8).toFixed(1);
      s.style.width = s.style.height = sz + 'px';
      sparksEl.appendChild(s);
    }
  }

  /* ---- cracks radiating from the cut ---- */
  function buildCracks() {
    cracksEl.innerHTML = '';
    const anchors = [[100,27],[86,31],[70,36],[54,41],[38,46],[22,52],[8,58]];
    anchors.forEach(([x, y]) => {
      const branches = Math.random() < 0.55 ? 2 : 1;
      for (let b = 0; b < branches; b++) {
        let px = x, py = y;
        let d  = `M ${px} ${py}`;
        const baseAng = Math.atan2(46 - 24, -8 - 108) + (Math.random() - 0.5) * 2.6;
        const segs = 3 + Math.floor(Math.random() * 3);
        for (let i = 0; i < segs; i++) {
          const len = 3 + Math.random() * 8;
          px += Math.cos(baseAng + (Math.random() - 0.5) * 1.5) * len;
          py += Math.sin(baseAng + (Math.random() - 0.5) * 1.5) * len;
          d += ` L ${px.toFixed(1)} ${py.toFixed(1)}`;
        }
        const p = document.createElementNS(SVGNS, 'path');
        p.setAttribute('d', d);
        p.setAttribute('class', 'crack');
        p.style.animationDelay = (0.97 + Math.random() * 0.28).toFixed(2) + 's';
        cracksEl.appendChild(p);
      }
    });
  }

  function endIntro() {
    if (!introEl.isConnected) return;
    introEl.style.animation = 'none';
    introEl.style.transition = 'opacity .6s ease, visibility .6s';
    introEl.style.opacity = '0';
    introEl.style.visibility = 'hidden';
    setTimeout(() => introEl.remove(), 650);
    document.body.classList.remove('locked');
  }

  buildDrips();
  buildSplatter();
  buildSparks();
  buildCracks();

  const timer = setTimeout(endIntro, 4750);

  introEl.addEventListener('click', () => {
    clearTimeout(timer);
    endIntro();
  }, { once: true });
})();

/* ================================================================
   3. AUTH (Discord OAuth2 — implicit grant)
   ================================================================ */
function saveSession(u) {
  user = u;
  if (u) localStorage.setItem(LS_SESSION, JSON.stringify(u));
  else   localStorage.removeItem(LS_SESSION);
  renderAll();
}

function loadSession() {
  try {
    const raw = localStorage.getItem(LS_SESSION);
    if (raw) user = JSON.parse(raw);
  } catch { user = null; }
}

function isOwner() {
  if (!user) return false;
  if (demoMode && user.demoOwner) return true;
  if (OWNER_IDS.includes(user.id)) return true;
  const names = [user.username, user.global_name].filter(Boolean).map(s => s.toLowerCase());
  return names.some(n => OWNER_USERNAMES.includes(n));
}

function login() {
  if (location.protocol === 'file:') {
    toast('Open the site over http:// or https:// — Discord blocks file://', 5000);
    return;
  }
  const state = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
  sessionStorage.setItem('massacre.state', state);

  const params = new URLSearchParams({
    client_id:     CLIENT_ID,
    response_type: 'token',
    scope:         'identify email',
    redirect_uri:  REDIRECT_URI,
    state,
    prompt:        'consent'
  });
  location.href = 'https://discord.com/oauth2/authorize?' + params.toString();
}

async function handleOAuthRedirect() {
  const hash = location.hash.slice(1);
  if (!hash || !hash.includes('access_token')) return;

  const p     = new URLSearchParams(hash);
  const token = p.get('access_token');
  const state = p.get('state');
  const saved = sessionStorage.getItem('massacre.state');

  history.replaceState(null, '', location.pathname + location.search);
  sessionStorage.removeItem('massacre.state');

  if (saved && state && saved !== state) {
    toast('OAuth state mismatch — login aborted.');
    return;
  }

  try {
    const res = await fetch('https://discord.com/api/users/@me', {
      headers: { Authorization: 'Bearer ' + token }
    });
    if (!res.ok) throw new Error('Discord API ' + res.status);
    const u = await res.json();

    saveSession({
      id:          u.id,
      username:    u.username,
      global_name: u.global_name || u.username,
      avatar:      u.avatar
        ? 'https://cdn.discordapp.com/avatars/' + u.id + '/' + u.avatar + '.png?size=128'
        : null,
      email:       u.email || null,
      token,
      ts:          Date.now()
    });
    toast('Welcome, ' + (u.global_name || u.username));
  } catch (err) {
    console.error(err);
    toast('Discord login failed: ' + err.message, 4500);
  }
}

function logout() {
  saveSession(null);
  toast('Logged out.');
}

function demoLogin(asOwner) {
  demoMode = true;
  saveSession({
    id:          'demo-0000',
    username:    asOwner ? 'iamtira.misu' : 'guest_user',
    global_name: asOwner ? 'iamtira.misu' : 'Guest',
    avatar:      null,
    email:       null,
    demo:        true,
    demoOwner:   !!asOwner,
    ts:          Date.now()
  });
  toast(asOwner ? 'Previewing as OWNER (local only)' : 'Previewing as guest (local only)');
}

/* ================================================================
   4. KEYS
   ================================================================ */
const ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

function randomSegment(len = 4) {
  const bytes = randBytes(len);
  let out = '';
  for (let i = 0; i < len; i++) out += ALPHABET[bytes[i] % ALPHABET.length];
  return out;
}

function newKeyCode() {
  return 'MASSACRE-' + randomSegment() + '-' + randomSegment() + '-' + randomSegment();
}

function loadKeys() {
  try { return JSON.parse(localStorage.getItem(LS_KEYS)) || []; }
  catch { return []; }
}
function saveKeys(list) {
  localStorage.setItem(LS_KEYS, JSON.stringify(list));
}

function generateKeys(amount, source = 'owner') {
  const list = loadKeys();
  const made = [];
  for (let i = 0; i < amount; i++) {
    const entry = {
      code:      newKeyCode(),
      created:   Date.now(),
      source,
      createdBy: user ? user.id : null,
      claimedBy: null
    };
    list.unshift(entry);
    made.push(entry);
  }
  saveKeys(list);
  return made;
}

function assignKeyToUser(code) {
  localStorage.setItem(LS_MYKEY + '.' + user.id, code);
  const list = loadKeys();
  const k = list.find(x => x.code === code);
  if (k) { k.claimedBy = user.id; saveKeys(list); }
}

function getMyKey() {
  if (!user) return null;
  return localStorage.getItem(LS_MYKEY + '.' + user.id);
}

/* ================================================================
   5. RENDERING
   ================================================================ */
function renderAll() {
  renderHeader();
  renderKeyCard();
}

function renderHeader() {
  const chip     = $('#userChip');
  const loginBtn = $('#loginBtn');

  if (user) {
    loginBtn.classList.add('hidden');
    chip.classList.remove('hidden');

    $('#userName').textContent = user.global_name || user.username;

    const av = $('#userAvatar');
    if (user.avatar) { av.src = user.avatar; av.style.display = 'block'; }
    else {
      av.removeAttribute('src');
      av.style.display = 'none';
      av.style.background = 'linear-gradient(135deg,#ff2d45,#5a0010)';
    }

    $('#ownerTag').classList.toggle('hidden', !isOwner());
    $('#settingsBtn').classList.toggle('hidden', !isOwner());
  } else {
    loginBtn.classList.remove('hidden');
    chip.classList.add('hidden');
  }
}

function renderKeyCard() {
  const box = $('#keyCardBody');

  if (!user) {
    box.innerHTML =
      '<p class="muted">Log in with Discord to purchase a key and manage it from anywhere.</p>' +
      '<button class="btn ghost wide" style="margin-top:18px" data-act="login">Login with Discord</button>';
    return;
  }

  const code = getMyKey();

  if (!code) {
    box.innerHTML =
      '<p class="muted">You don\'t own a key yet. Grab one and it will appear here instantly.</p>' +
      '<button class="btn primary wide" style="margin-top:18px" data-act="buy">Buy a Key</button>';
    return;
  }

  box.innerHTML =
    '<div class="status"><i></i>Active</div>' +
    '<div class="keybox">' +
      '<code id="myKeyCode">' + code + '</code>' +
      '<button class="btn ghost small" data-act="copy" data-code="' + code + '">Copy</button>' +
    '</div>' +
    '<p class="muted" style="margin-top:16px;font-size:12px">' +
      'Bound to <strong>' + (user.global_name || user.username) + '</strong> · ' +
      'keep this private, it activates your access.' +
    '</p>';
}

/* ================================================================
   6. MODALS
   ================================================================ */
const backdrop = $('#modalBackdrop');

function openModal(title, html) {
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = html;
  backdrop.classList.remove('hidden');
  document.body.classList.add('locked');
}
function closeModal() {
  backdrop.classList.add('hidden');
  document.body.classList.remove('locked');
}

$('#modalClose').addEventListener('click', closeModal);
backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function openCheckout() {
  if (!user) { openLoginPrompt(); return; }

  openModal('Checkout', `
    <p class="muted" style="margin-bottom:18px">
      You're buying <strong style="color:#fff">1 × MASSACRE Lifetime Key</strong> for
      <strong style="color:#fff">$19.99</strong>.
    </p>
    <div class="keybox" style="justify-content:flex-start">
      <span class="muted" style="font-size:12px">
        ⚠️ Demo checkout — wire this button to Stripe / PayPal / your backend here.
      </span>
    </div>
    <div style="display:flex;gap:10px;margin-top:22px;flex-wrap:wrap">
      <button class="btn primary" style="flex:1" id="confirmBuy">Complete Purchase</button>
      <button class="btn ghost" data-act="close">Cancel</button>
    </div>
  `);

  $('#confirmBuy').addEventListener('click', () => {
    const existing = getMyKey();
    if (existing) {
      closeModal();
      toast('You already own a key.');
      return;
    }
    const [entry] = generateKeys(1, 'purchase');
    assignKeyToUser(entry.code);
    renderAll();
    closeModal();
    toast('Purchase complete — your key is ready.');
  });
}

function openLoginPrompt() {
  openModal('Login Required', `
    <p class="muted">
      MASSACRE uses Discord for authentication. Log in to buy a key,
      view your key, and manage your access.
    </p>
    <div style="display:flex;gap:10px;margin-top:22px;flex-wrap:wrap">
      <button class="btn primary" style="flex:1" data-act="login">Login with Discord</button>
      <button class="btn ghost" data-act="close">Not now</button>
    </div>
  `);
}

function openKeyManager() {
  if (!isOwner()) { toast('Access denied.'); return; }

  const list = loadKeys();

  const rows = list.length
    ? list.map(k => `
        <div class="km-row">
          <code>${k.code}</code>
          <span class="tagx ${k.claimedBy ? 'used' : ''}">
            ${k.claimedBy ? 'claimed' : (k.source === 'owner' ? 'owner' : 'purchase')}
          </span>
        </div>`).join('')
    : '<div class="empty">No keys generated yet.</div>';

  openModal('Key Manager', `
    <div class="km-controls">
      <div class="field">
        <label for="kmAmount">Amount</label>
        <input id="kmAmount" type="number" min="1" max="100" value="5" />
      </div>
      <button class="btn primary small" id="kmGen">Generate Keys</button>
      <button class="btn ghost small" id="kmCopyAll">Copy All</button>
      <button class="btn ghost small" id="kmWipe">Wipe</button>
    </div>
    <p class="muted" style="font-size:12px;margin-bottom:14px">
      ${list.length} key${list.length === 1 ? '' : 's'} total · owner keys are free &amp; unlimited.
    </p>
    <div class="km-list" id="kmList">${rows}</div>
  `);

  $('#kmGen').addEventListener('click', () => {
    const n = Math.max(1, Math.min(100, parseInt($('#kmAmount').value, 10) || 1));
    generateKeys(n, 'owner');
    toast(n + ' key' + (n === 1 ? '' : 's') + ' generated.');
    openKeyManager();
  });

  $('#kmCopyAll').addEventListener('click', () => {
    const text = loadKeys().map(k => k.code).join('\n');
    if (!text) { toast('Nothing to copy.'); return; }
    copyText(text).then(() => toast('All keys copied.'));
  });

  $('#kmWipe').addEventListener('click', () => {
    if (!confirm('Delete every stored key? This cannot be undone.')) return;
    saveKeys([]);
    toast('Key pool wiped.');
    openKeyManager();
  });
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch {}
    ta.remove();
    return true;
  }
}

/* ================================================================
   7. EVENT WIRING
   ================================================================ */
$('#loginBtn').addEventListener('click', login);
$('#logoutBtn').addEventListener('click', logout);
$('#settingsBtn').addEventListener('click', openKeyManager);
$('#buyBtn').addEventListener('click', openCheckout);
$('#year').textContent = new Date().getFullYear();

$('#demoLink').addEventListener('click', e => {
  e.preventDefault();
  const wantsOwner = new URLSearchParams(location.search).get('demo') === 'owner';
  demoLogin(wantsOwner);
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  if (act === 'login')  login();
  if (act === 'buy')    openCheckout();
  if (act === 'close')  closeModal();
  if (act === 'copy')   copyText(el.dataset.code).then(() => toast('Key copied to clipboard.'));
});

/* ================================================================
   8. BOOT
   ================================================================ */
(async function boot() {
  loadSession();
  await handleOAuthRedirect();
  renderAll();

  if (user) console.log('%cMASSACRE', 'color:#ff2d45;font-weight:800', 'logged in as', user.username);
})();
</script>
